name: Generate & Email Timesheets

on:
  schedule:
    # Run on the 1st of every month at 09:00 IST (UTC+5:30)
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 1 * *"
  workflow_dispatch:  # manual trigger always available

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generator (dry-run to validate)
        run: python timesheet_generator.py --dry-run

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Generate and email timesheets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python timesheet_generator.py --email